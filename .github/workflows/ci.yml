name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and behavioral tests
        run: pytest -q
      - name: Retrieval eval gate
        # A forced match always exits 1; accuracy below the floor exits 1.
        run: resume eval --fail-under 75
