# Discovery targets for the weekly search: tech companies with APM, rotational
# or junior PM roles in Canada/US. Read by career-ops' scan.mjs (copy to its
# data dir as portals.yml). Research + liveness checks: Nov 2026.
# Workday entries are disabled for career-ops (it pages whole boards and gets
# rate-limited); `resume scan-workday` searches them gently instead.
# Every host here must be allowed in the cloud environment's network policy.
title_filter:
  positive:
  - Associate Product Manager
  - word:APM
  - Apprentice Product
  - Rotational Product
  - Product Manager
  - Product Operations
  - Product Ops
  - Growth Product
  - New Grad
  - Early Career
  negative:
  - word:Senior
  - word:Sr
  - word:Staff
  - word:Principal
  - word:Director
  - Head of
  - word:VP
  - word:Lead
  - Group Product
  - Product Manager II
  - Product Manager III
  - Engineering Manager
  - word:Intern
  - Internship
  - Marketing Manager
location_filter:
  always_allow:
  - Canada
  - Vancouver
  - Toronto
  - Montreal
  - United States
  - USA
  block_hard:
  - London
  - Dublin, Ireland
  - United Kingdom
  - Germany
  - Berlin
  - Paris
  - Amsterdam
  - India
  - Bengaluru
  - Singapore
  - Sydney
  - Tokyo
  - Brazil
  - Mexico City
  allow:
  - Remote
  - North America
  - San Francisco
  - New York
  - Seattle
